<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IG English CC</title>
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141414;
      color: #f2f2f2;
      font-size: 13px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 12px;
      font-weight: 600;
      color: #e5e5e5;
    }
    p {
      margin: 0 0 6px;
      color: #a3a3a3;
      line-height: 1.4;
      font-size: 11.5px;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    textarea, input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1f1f1f;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    textarea {
      height: 66px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    #saveBtn {
      background: #ffffff;
      color: #111111;
    }
    #clearCacheBtn {
      background: #2a2a2a;
      color: #d4d4d4;
      flex: 0 0 auto;
    }
    #status {
      margin-top: 8px;
      min-height: 16px;
      font-size: 12px;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <h1>IG English CC</h1>

  <label for="keysInput">Groq API Keys (Subtitles + Fallback)</label>
  <p>
    Free keys from <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">console.groq.com</a> (one per line for auto-rotation).
  </p>
  <textarea id="keysInput" placeholder="gsk_..."></textarea>

  <label for="geminiKeyInput">Gemini API Key (Optional — AI Study Cards)</label>
  <p>
    Free key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">aistudio.google.com</a>. If empty, Groq LLM is used automatically.
  </p>
  <input id="geminiKeyInput" type="password" placeholder="AQ.... or AIza..." autocomplete="off" />

  <label for="geminiModelInput">Gemini Model ID</label>
  <input id="geminiModelInput" type="text" placeholder="gemini-3.5-flash" />

  <div class="row">
    <button id="saveBtn" type="button">Save Settings</button>
    <button id="clearCacheBtn" type="button">Clear Cache</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
